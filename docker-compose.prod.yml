# Chạy thử bản giống PRODUCTION trên máy local (cũng là mẫu cho Coolify).
#   docker compose -p glow-prod -f docker-compose.prod.yml up --build
# (-p glow-prod: tách khỏi project dev để không đụng container/volume dev)
# Biến môi trường lấy từ .env.prod (copy từ .env.example, đặt STORAGE_DRIVER=local).
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glow}
      POSTGRES_DB: glow
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glow -d glow"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://glow:${POSTGRES_PASSWORD:-glow}@db:5432/glow
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://glow:${POSTGRES_PASSWORD:-glow}@db:5432/glow
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
